name: release

on:
  push:
    tags:
      # Supports both "v0.0.1" and bare "0.0.1+b1" style tags.
      - "v*"
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Set up Node for extension build
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Build browser extension
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publish ${{ matrix.rid }}
        run: dotnet publish desktop/RailwayQuickBook.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o desktop/publish/${{ matrix.rid }}
      - name: Verify the single file is really self-contained
        shell: bash
        run: |
          cd "desktop/publish/${{ matrix.rid }}"
          echo "Publish output:"
          ls -la
          STRAY="$(ls -1 | grep -v -E '\.(exe|pdb)$' || true)"
          if [ -n "$STRAY" ]; then
            echo "::error::Files other than the single-file exe are present. They are NOT uploaded to the release, so the shipped exe would fail to start:"
            echo "$STRAY"
            exit 1
          fi
          echo "OK - nothing but the exe (and pdb) in the publish directory."
      - name: Name the exe per architecture
        shell: bash
        run: mv "desktop/publish/${{ matrix.rid }}/RailwayQuickBook.exe" "desktop/publish/${{ matrix.rid }}/RailwayQuickBook-${{ matrix.rid }}.exe"
      - name: Bundle extension and zip
        shell: bash
        run: |
          cp -r dist "desktop/publish/${{ matrix.rid }}/dist"
          cd "desktop/publish/${{ matrix.rid }}"
          powershell -NoProfile -Command "Compress-Archive -Path 'RailwayQuickBook-${{ matrix.rid }}.exe','dist' -DestinationPath 'RailwayQuickBook-${{ matrix.rid }}.zip'"
          ls -la
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailwayQuickBook-${{ matrix.rid }}
          path: desktop/publish/${{ matrix.rid }}/RailwayQuickBook-${{ matrix.rid }}.zip
          if-no-files-found: error

  build-windows-fx:
    # Slim download for PCs that already have the .NET 8 Desktop Runtime
    # installed. Same app without the bundled runtime: ~30MB, not ~90MB.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Set up Node for extension build
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Build browser extension
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publish win-x64 framework-dependent
        run: dotnet publish desktop/RailwayQuickBook.Desktop.csproj -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -o desktop/publish/win-x64-fx
      - name: Verify the single file has no stray siblings
        shell: bash
        run: |
          cd desktop/publish/win-x64-fx
          echo "Publish output:"
          ls -la
          STRAY="$(ls -1 | grep -v -E '\.(exe|pdb)$' || true)"
          if [ -n "$STRAY" ]; then
            echo "::error::Unexpected files beside the framework-dependent exe (only it is uploaded):"
            echo "$STRAY"
            exit 1
          fi
          echo "OK - nothing but the exe (and pdb) in the publish directory."
      - name: Name the fx exe distinctly
        shell: bash
        run: mv desktop/publish/win-x64-fx/RailwayQuickBook.exe desktop/publish/win-x64-fx/RailwayQuickBook-win-x64-fx.exe
      - name: Bundle extension and zip
        shell: bash
        run: |
          cp -r dist desktop/publish/win-x64-fx/dist
          cd desktop/publish/win-x64-fx
          powershell -NoProfile -Command "Compress-Archive -Path 'RailwayQuickBook-win-x64-fx.exe','dist' -DestinationPath 'RailwayQuickBook-win-x64-fx.zip'"
          ls -la
      - name: Upload fx exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailwayQuickBook-win-x64-fx
          path: desktop/publish/win-x64-fx/RailwayQuickBook-win-x64-fx.zip
          if-no-files-found: error

  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish linux-x64
        run: dotnet publish desktop/RailwayQuickBook.Desktop.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o desktop/publish/linux-x64
      - name: Verify the single file is really self-contained
        run: |
          cd desktop/publish/linux-x64
          echo "Publish output:"
          ls -la
          # build-deb.sh copies only the RailwayQuickBook binary into the .deb,
          # so any sibling .so would be missing from the installed package.
          STRAY="$(ls -1 | grep -v -E '^RailwayQuickBook$' | grep -v -E '\.pdb$' || true)"
          if [ -n "$STRAY" ]; then
            echo "::error::Files other than the single binary are present. build-deb.sh does not package them, so the installed app would fail to start:"
            echo "$STRAY"
            exit 1
          fi
          echo "OK - nothing but the binary (and pdb) in the publish directory."
      - name: Resolve package version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaging version ${VERSION}"
      - name: Build .deb
        run: bash desktop/packaging/linux/build-deb.sh "${{ steps.ver.outputs.version }}"
      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailwayQuickBook-deb
          path: desktop/publish/*.deb
          if-no-files-found: error

  release:
    needs: [build-windows, build-windows-fx, build-linux-deb]
    # Only tag pushes produce a GitHub Release; workflow_dispatch just builds artifacts.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List what will be attached to the release
        run: find artifacts -type f -printf '%s\t%p\n' | sort
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
