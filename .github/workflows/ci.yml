name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop-publish:
    name: desktop publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish ${{ matrix.rid }}
        run: dotnet publish desktop/RailwayQuickBook.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o desktop/publish/${{ matrix.rid }}
      # The release only ever uploads the single executable. If the publish step
      # leaves native libraries beside it (the default unless
      # IncludeNativeLibrariesForSelfExtract is true) the shipped binary cannot
      # start. That is exactly how v0.0.1-b1 shipped broken, so fail here.
      - name: Verify the single file is really self-contained
        shell: bash
        run: |
          cd "desktop/publish/${{ matrix.rid }}"
          echo "Publish output:"
          ls -la
          STRAY="$(ls -1 | grep -v -E '^RailwayQuickBook(\.exe)?$' | grep -v -E '\.pdb$' || true)"
          if [ -n "$STRAY" ]; then
            echo "::error::Native libraries or extra files were left next to the single-file output; the release would ship an exe that cannot start:"
            echo "$STRAY"
            exit 1
          fi
          echo "OK - single-file output is genuinely self-contained."
      - name: Package .deb (smoke test)
        if: matrix.rid == 'linux-x64'
        run: bash desktop/packaging/linux/build-deb.sh "0.0.1+b1"

  desktop-publish-fx:
    name: desktop publish (win-x64 framework-dependent)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish win-x64 framework-dependent
        run: dotnet publish desktop/RailwayQuickBook.Desktop.csproj -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -o desktop/publish/win-x64-fx
      - name: Verify no stray siblings
        shell: bash
        run: |
          cd desktop/publish/win-x64-fx
          ls -la
          STRAY="$(ls -1 | grep -v -E '\.(exe|pdb)$' || true)"
          if [ -n "$STRAY" ]; then
            echo "::error::Unexpected files beside the framework-dependent exe:"
            echo "$STRAY"
            exit 1
          fi
          echo "OK - framework-dependent output is a single exe."

  extension:
    name: extension typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
