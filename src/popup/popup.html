<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Railway Booking Assistant</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <main class="wrap">
    <h1>Railway Booking Assistant</h1>
    <p class="hint">Log in to the railway site manually first. This tool only fills forms faster — it never handles passwords, OTPs, CAPTCHAs, or payments.</p>

    <section class="status" aria-live="polite">
      <div><strong>State:</strong> <span id="state">…</span></div>
      <div class="detail" id="detail">Loading…</div>
    </section>

    <form id="configForm">
      <label>Origin <input id="origin" name="origin" required maxlength="100" autocomplete="off" /></label>
      <label>Destination <input id="destination" name="destination" required maxlength="100" autocomplete="off" /></label>
      <label>Journey date <input id="journeyDate" name="journeyDate" type="date" required /></label>
      <label>Preferred train (optional) <input id="preferredTrain" maxlength="100" autocomplete="off" /></label>
      <label>Preferred class (optional) <input id="preferredClass" maxlength="50" autocomplete="off" /></label>
      <label>Booking time <input id="bookingTime" type="datetime-local" required /></label>
      <label>Timezone <input id="timezone" value="Asia/Dhaka" maxlength="60" /></label>
      <div id="passengers"></div>
      <label class="row"><input id="allowSubstitution" type="checkbox" /> Allow substitution if exact train/class unavailable</label>
      <div id="formErrors" class="errors" role="alert"></div>
      <div class="actions">
        <button type="submit">Save</button>
        <button type="button" id="armBtn">Arm</button>
        <button type="button" id="stopBtn">Stop</button>
      </div>
    </form>

    <section class="privacy">
      <h2>Privacy</h2>
      <p>Stored locally on this device only.</p>
      <button id="clearPassengers" type="button">Clear Passenger Data</button>
      <button id="clearAll" type="button">Clear All Extension Data</button>
    </section>

    <p><a href="../options/options.html" target="_blank" rel="noopener">Open full options</a></p>
  </main>
  <script type="module" src="./popup.js"></script>
</body>
</html>
