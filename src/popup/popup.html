<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booking Assistant</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <main class="pop">
    <header class="brand">
      <img src="../icons/icon-32.png" alt="" width="20" height="20" />
      <span class="brandname">Booking Assistant</span>
      <span class="spacer"></span>
      <a class="optlink" href="../options/options.html" target="_blank" rel="noopener">Options</a>
    </header>

    <section class="statusbar" id="statusbar" data-state="idle" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <div>
        <div class="stitle" id="statusTitle">Idle</div>
        <div class="sdesc" id="statusDesc">Set your trip, then arm the assistant.</div>
      </div>
    </section>

    <form id="tripForm">
      <div class="grid2">
        <div class="field">
          <label for="origin">From</label>
          <input id="origin" name="origin" required maxlength="100" autocomplete="off" placeholder="Dhaka" />
        </div>
        <div class="field">
          <label for="destination">To</label>
          <input id="destination" name="destination" required maxlength="100" autocomplete="off" placeholder="Chattogram" />
        </div>
        <div class="field">
          <label for="journeyDate">Journey date</label>
          <input id="journeyDate" class="mono" type="date" required />
        </div>
        <div class="field">
          <label for="watchFrom">Watch from</label>
          <input id="watchFrom" class="mono" type="time" value="08:00" required />
        </div>
      </div>
      <p class="hint" id="watchHint">Booking window opens at the time above, in Asia/Dhaka.</p>

      <hr class="divider" />

      <div id="passengers"></div>
      <button type="button" class="btn-text" id="addPassenger">+ Add passenger — 1 of 6</button>

      <label class="check">
        <input id="allowSubstitution" type="checkbox" />
        <span>Book the nearest available class if the exact match is full</span>
      </label>

      <div id="formErrors" class="errors" role="alert"></div>

      <div class="actions">
        <button type="submit" class="btn">Save</button>
        <button type="button" class="btn btn-primary" id="primaryBtn" data-state="idle">Arm the assistant</button>
      </div>
    </form>

  </main>
  <script type="module" src="./popup.js"></script>
</body>
</html>
